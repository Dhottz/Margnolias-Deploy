{% extends "painel/base.html" %}
{% block body %}
<main style="max-width:360px;margin-top:4rem">
  <div class="card">
    <h2 style="margin-top:0">Painel de leads</h2>
    {% if sem_senha %}<p class="meta">ADMIN_PASSWORD não foi definida no servidor.</p>{% endif %}
    {% if erro %}<p style="color:#b00020">Senha incorreta.</p>{% endif %}
    <form method="post" style="display:flex;flex-direction:column;gap:.7rem">
      <input type="password" name="senha" placeholder="Senha" autofocus required>
      <button type="submit">Entrar</button>
    </form>
  </div>
</main>
{% endblock %}
